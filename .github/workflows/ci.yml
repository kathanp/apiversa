name: ci
on:
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: guard
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$BASE" 2>/dev/null || BASE=origin/main
          node scripts/guard.mjs --gate-fast --verify-docs --verify-roadmap --base "$BASE"
  node:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "present=$([ -f node/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm, cache-dependency-path: node/package-lock.json }
      - if: steps.has.outputs.present == 'true'
        working-directory: node
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run conformance
  spring:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { java: [17, 21] }
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "present=$([ -f spring/pom.xml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ matrix.java }}', cache: maven }
      - if: steps.has.outputs.present == 'true'
        working-directory: spring
        run: mvn -q -B verify
